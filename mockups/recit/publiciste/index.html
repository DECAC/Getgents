<title>Le Publiciste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;1,500&family=Playwrite+FR+Trad:wght@300;400&family=Gochi+Hand&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Interface d'un gent Getgents (jetons de styles/tokens.css : crème, corail, Sora). Chaque proposition, elle, porte sa propre direction.
   Une colonne lisible ; les cartes de choix passent sur 3 colonnes au-delà de 900 px. Univers clair assumé : toutes les couleurs sont posées ici. */
:root {
  --ink: #2a1f19; --muted: #73665f; --faint: #a2958f;
  --bg: #fbf3ed; --card: #fffdf9; --line: #eadbd3; --line-soft: #f3e9e3;
  --corail: #e65d76; --corail-700: #c73758; --corail-tint: #ffdee2;
  --succes: #57a45b; --succes-tint: #d4f1d4;
  --r: 18px;
  --f-ui: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* charte relevée sur le site de la marque, 27/11 */
  --marque-bleu: #29377d; --marque-bleu-nuit: #192563; --marque-rouge: #c54538; --marque-gris: #f6f6f6;
  color-scheme: light;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--corail); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }

.barre {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.barre-in { max-width: 1080px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ident { display: flex; align-items: center; gap: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--card); font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
.ident b { display: block; font-size: 15px; line-height: 1.2; }
.ident small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
@media (max-width: 480px) { .cout-l { display: none; } }
.ident .cout { margin-left: auto; flex: none; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.etapes { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; margin: 0 -4px; padding-inline: 4px; }
.etapes::-webkit-scrollbar { display: none; }
.etape-b {
  flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 6px 12px 6px 7px; font-size: 13px; color: var(--muted); white-space: nowrap;
}
.etape-b .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--line-soft); color: var(--muted); }
.etape-b[aria-current="step"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.etape-b[aria-current="step"] .n { background: var(--ink); color: var(--card); }
.etape-b.fait .n { background: var(--succes); color: #fff; }

main { max-width: 1080px; margin: 0 auto; padding-block: 22px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vue { display: grid; gap: 20px; }
.bulle { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; max-width: 760px; }
.bulle .avatar { width: 38px; height: 38px; }
.bulle .txt { background: var(--card); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 14px 16px; min-width: 0; }
.bulle .txt p { margin: 0; }
.bulle .txt p + p { margin-top: 8px; }
.bulle .txt strong { font-weight: 600; }
h2.titre { margin: 4px 0 0; font-size: clamp(22px, 5.2vw, 28px); line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; }
.sous { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }

.choix { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .choix.trois { grid-template-columns: repeat(3, 1fr); } .choix.deux-col { grid-template-columns: repeat(2, 1fr); } }
.carte {
  position: relative; display: grid; gap: 10px; align-content: start; text-align: left; min-width: 0;
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; transition: border-color .15s, box-shadow .15s;
}
.carte:hover { border-color: #d9c4b9; }
.carte[aria-pressed="true"], .carte.choisie { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(42,31,25,.08); }
.carte .badge-reco { position: absolute; top: 18px; left: 18px; z-index: 1; background: var(--corail); color: #fff; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.carte .badge-choisi { position: absolute; top: 18px; right: 18px; z-index: 1; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: none; }
.carte[aria-pressed="true"] .badge-choisi, .carte.choisie .badge-choisi { display: block; }
.carte img.planche { width: 100%; aspect-ratio: 928 / 1152; object-fit: cover; border-radius: 10px; display: block; background: var(--line-soft); }
.carte h3 { margin: 2px 4px 0; font-size: 17px; letter-spacing: -.01em; }
.carte .desc { margin: 0 4px; color: #4d4139; font-size: 14px; }
.pour-contre { margin: 0 4px 4px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.pour-contre span::before { font-family: var(--f-mono); margin-right: 6px; color: var(--ink); }
.pour-contre .p::before { content: "+"; color: var(--succes); }
.pour-contre .c::before { content: "−"; color: var(--corail-700); }
.carte .action { margin: 0 4px 4px; justify-self: start; border: 1px solid var(--ink); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; }
.carte[aria-pressed="true"] .action, .carte.choisie .action { background: var(--ink); color: var(--card); }

.autre { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: transparent; border: 1px dashed #d9c4b9; border-radius: var(--r); padding: 14px 16px; color: var(--muted); font-size: 14px; }
.autre textarea { flex: 1 1 260px; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; resize: vertical; font-size: 15px; }
.bouton { border: 0; border-radius: 999px; background: var(--ink); color: var(--card); padding: 11px 18px; font-weight: 600; font-size: 14.5px; }
.bouton.corail { background: var(--corail); }
.bouton.leger { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.note { font-size: 12.5px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Typographie : spécimens */
.specimen { border-radius: 12px; padding: 18px 16px; display: grid; gap: 12px; min-height: 260px; align-content: start; }
.specimen .etq { justify-self: start; padding: 6px 12px; border-radius: 3px; transform: rotate(-2deg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.specimen .h { margin: 0; line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.specimen .b { margin: 0; font-size: 13.5px; line-height: 1.5; }
.specimen .dev { margin: 0; }
.specimen .btn { justify-self: start; padding: 9px 16px; border-radius: 999px; font-size: 13px; }
.spec-marque { background: var(--marque-gris); color: var(--marque-bleu); font-family: "Montserrat", sans-serif; }
.spec-marque .etq { background: #fff; font-family: "Gochi Hand", "Segoe Print", cursive; font-size: 21px; color: var(--marque-bleu); }
.spec-marque .h { font-weight: 800; font-size: 25px; color: #000; }
.spec-marque .dev { font-family: "Gochi Hand", cursive; font-size: 22px; color: var(--marque-rouge); }
.spec-marque .btn { background: var(--marque-bleu); color: #fff; font-weight: 700; }
.spec-cahier { color: var(--marque-bleu); font-family: "Montserrat", sans-serif;
  background-color: #fbfaf5;
  background-image: linear-gradient(90deg, transparent 0 30px, rgba(197,69,56,.55) 30px 31px, transparent 31px),
    linear-gradient(rgba(41,55,125,.32) 1px, transparent 1px), linear-gradient(rgba(120,150,210,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(120,150,210,.22) 1px, transparent 1px);
  background-size: 100% 100%, 100% 32px, 100% 8px, 32px 100%; padding-left: 44px; }
.spec-cahier .etq { background: #fff; font-family: "Playwrite FR Trad", "Segoe Script", cursive; font-size: 15px; line-height: 1.9; color: var(--marque-bleu); }
.spec-cahier .h { font-weight: 800; font-size: 24px; color: var(--marque-bleu-nuit); }
.spec-cahier .dev { font-family: "Playwrite FR Trad", cursive; font-size: 16px; line-height: 2; color: var(--marque-bleu); }
.spec-cahier .dev u { text-decoration-color: var(--marque-rouge); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.spec-cahier .btn { background: var(--marque-bleu); color: #fff; font-weight: 700; }
.spec-affiche { background: #efe6d6; color: #24201a; font-family: "Montserrat", sans-serif; }
.spec-affiche .etq { background: #24201a; color: #efe6d6; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; border-radius: 2px; }
.spec-affiche .h { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 29px; letter-spacing: -.03em; }
.spec-affiche .dev { font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 18px; color: var(--marque-rouge); }
.spec-affiche .btn { background: #24201a; color: #efe6d6; font-weight: 700; }

/* Couleurs */
.nuancier { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 12px; overflow: hidden; height: 64px; }
.nuancier span { display: block; }
.teintes { display: grid; gap: 3px; margin: 0 4px; }
.teintes div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.teintes code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.mini { border-radius: 12px; padding: 18px; display: grid; gap: 10px; justify-items: start; }
.mini .couv { width: 100%; height: 92px; border-radius: 6px; position: relative; overflow: hidden; }
.mini .couv i { position: absolute; left: 14px; top: 22px; padding: 6px 10px; font-style: normal; font-size: 13px; transform: rotate(-2deg); border-radius: 2px; }
.mini .filet { width: 100%; height: 4px; border-radius: 2px; }

/* Lecteur audio */
.lecteur { display: flex; align-items: center; gap: 12px; margin: 0 4px; }
.play { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--card); display: grid; place-items: center; flex: none; }
.play svg { width: 18px; height: 18px; }
.piste { flex: 1; height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.piste i { display: block; height: 100%; width: 0; background: var(--corail); }
.duree { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); min-width: 34px; text-align: right; }
.musique .ressenti { margin: 0 4px; font-size: 14px; color: #4d4139; }
.musique .demande { margin: 0 4px; padding: 8px 10px; background: var(--line-soft); border-radius: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.forme-onde { height: 54px; margin: 0 4px; border-radius: 10px; }

.voix-grille { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .voix-grille { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 980px) { .voix-grille { grid-template-columns: repeat(4, 1fr); } }
.voix { padding: 12px; gap: 8px; }
.voix-groupes { display: grid; gap: 18px; }
.voix-groupe h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.voix.ecartee { opacity: .45; }
.voix .tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px; }
.voix .tete b { font-size: 16px; }
.voix .rangee { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 4px; }
.mini-b { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; }
.mini-b[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.mini-b.non[aria-pressed="true"] { background: var(--corail-tint); color: var(--corail-700); border-color: var(--corail-tint); }
.jeux { display: flex; gap: 8px; flex-wrap: wrap; }
.jeux .mini-b { padding: 8px 14px; font-size: 13.5px; }

/* Storyboard : une ligne par scène — la scène à gauche, le texte à droite */
.sb-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sequences { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seq-entete, .seq { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.seq-entete { background: var(--line-soft); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seq-entete span { padding: 8px 12px; }
.seq-entete span + span, .seq-texte { border-left: 1px solid var(--line-soft); }
.seq { border-top: 1px solid var(--line); }
.seq.modifiee { background: #fffaf3; }
.seq-scene, .seq-texte { min-width: 0; padding: 12px; display: grid; gap: 8px; align-content: start; }
.seq-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.seq-titre b { font-size: 14px; }
.seq-titre .temps { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.seq-visu { display: grid; gap: 8px; grid-template-columns: 1fr; }
.seq-visu img { width: 100%; max-width: 150px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; display: block; background: #fff; border: 1px solid var(--line-soft); }
@media (min-width: 760px) { .seq-visu { grid-template-columns: 112px minmax(0, 1fr); align-items: start; } .seq-visu img { max-width: none; } }
.lab { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 3px; }
.seq textarea, .global textarea {
  width: 100%; border: 1px solid transparent; border-radius: 9px; background: transparent; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);
  font-size: 14px; line-height: 1.45; resize: vertical; transition: border-color .15s, background .15s;
}
.seq textarea:hover { border-color: var(--line); background: #fff; }
.seq textarea:focus { border-color: var(--ink); background: #fff; outline: none; }
.seq textarea.vo { font-style: italic; font-size: 15px; }
.seq textarea { resize: none; }
.seq textarea.court { font-size: 13px; color: var(--muted); min-height: 0; resize: none; overflow: hidden; }
.seq textarea { overflow: hidden; }
.seq-etat { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--corail-700); font-weight: 600; }
.seq-etat button { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.global { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.global h3 { margin: 0; font-size: 16px; }
.global textarea { margin: 0; width: 100%; min-height: 96px; border-color: var(--line); background: #fff; font-size: 15px; }
.global textarea:focus { border-color: var(--ink); outline: none; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.global .reponse { background: var(--line-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
@media (max-width: 520px) { .seq-scene, .seq-texte { padding: 10px; } .seq textarea { font-size: 13.5px; } .seq textarea.vo { font-size: 14px; } }
/* Animatique */
#animatique { position: fixed; inset: 0; z-index: 30; background: #0f0c0a; display: grid; place-items: center; }
#animatique[hidden] { display: none; }
#animatique canvas { width: 100%; height: 100%; display: block; }
.an-haut { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #f3ece6; font-size: 12.5px; }
.an-haut .mono { color: #cfc4bc; }
.an-haut button { border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.14); color: #fff; font-size: 13px; }
.an-st { position: absolute; left: 0; right: 0; bottom: calc(50px + env(safe-area-inset-bottom, 0px)); text-align: center; padding-inline: 24px; color: #fff; font-size: clamp(16px, 4.4vw, 20px); text-shadow: 0 1px 3px #000, 0 0 14px rgba(0,0,0,.7); text-wrap: balance; min-height: 1.4em; }
.an-fil { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.12); }
.an-fil i { display: block; height: 100%; width: 0; background: var(--corail); }

/* Récapitulatif */
.recap { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; max-width: 760px; }
.recap .l { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line-soft); }
.recap .l:first-child { border-top: 0; }
.recap .l .k { font-size: 12.5px; color: var(--muted); }
.recap .l .v { font-weight: 600; min-width: 0; }
.recap .l .v small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.recap .l .v.vide { color: var(--corail-700); font-weight: 500; }
.recap .l button { border: 0; background: none; color: var(--corail-700); font-size: 13px; font-weight: 600; padding: 4px; }
.couts { display: grid; gap: 6px; max-width: 760px; background: var(--line-soft); border-radius: var(--r); padding: 14px 16px; font-size: 14px; }
.couts div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.couts div span:last-child { white-space: nowrap; }
.couts div span:first-child { min-width: 0; }
.couts .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.valide { max-width: 760px; background: var(--succes-tint); border-radius: var(--r); padding: 14px 16px; font-size: 14.5px; }

.pied { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.pied-in { max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pied .etat { font-size: 13px; color: var(--muted); min-width: 0; }

.brief { max-width: 760px; display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.brief div { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line-soft); font-size: 14px; }
.brief div:first-child { border-top: 0; }
.brief dt, .brief .k { color: var(--muted); font-size: 12.5px; }
.brief blockquote { margin: 0; font-style: italic; }
@media (max-width: 420px) { .brief div, .recap .l { grid-template-columns: 1fr; gap: 2px; } .recap .l button { justify-self: start; padding-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; } }
</style>

<header class="barre">
  <div class="barre-in">
    <div class="ident">
      <span class="avatar" aria-hidden="true">P</span>
      <span><b>Le Publiciste</b><small>Projet « Le premier couteau » · Le Cadeau Français</small></span>
      <span class="cout"><span class="cout-l">Direction artistique<br></span><span id="cout-haut">1,47 $</span></span>
    </div>
    <nav class="etapes" id="etapes" aria-label="Étapes"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="pied">
  <div class="pied-in">
    <span class="etat" id="etat"></span>
    <span style="display:flex;gap:8px"><button class="bouton leger" id="prec" type="button">Retour</button><button class="bouton" id="suiv" type="button">Suivant</button></span>
  </div>

const nomDe = (liste, id) => (liste.find((x) => x.id === id) || {}).nom || null;

/* ── Navigation ──────────────────────────────────────────── */
const fait = (id) => ({ visuel: !!S.visuel, typo: !!S.typo, couleurs: !!S.couleurs, musique: !!S.musique, voix: !!S.voix, storyboard: S.etape === "recap" || S.valide, recap: S.valide, brief: S.etape !== "brief" })[id];

/* ── Texte entier d'une voix : piste de 67 s ─────────────── */
function lireTexteEntier(id, bouton) {

  if (encours) { audio.pause(); audio.dataset.entier = ""; return; }
  boutonActif = null; audio.src = `medias/voix-${id}.mp3`; audio.dataset.entier = id; audio.play().catch(() => {});

/* ── Animatique : croquis + voix + musique ───────────────── */
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, anim = null;
const cacheBuf = {}, cacheImg = {};
async function tampon(url) {

  const ab = await fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  return cacheBuf[url] = await new Promise((ok, ko) => { const p = actx.decodeAudioData(ab, ok, ko); if (p && p.then) p.then(ok, ko); });
}

  if (actx) { try { await actx.resume(); [bv, bm] = await Promise.all([tampon(`medias/voix-${voix}.mp3`), tampon(`medias/mus-${mus}.mp3`)]); } catch (e) { console.warn(e); } }

      const d = DUREES[voix] || DUREES.cedar;
      LIGNES.forEach(([t], k) => { gm.gain.setTargetAtTime(0.28, T0 + t - 0.2, 0.12); gm.gain.setTargetAtTime(0.5, T0 + t + d[k] + 0.2, 0.3); });

    const l = LIGNES.findIndex(([d], n) => t >= d && t < d + (DUREES[S.voix || "cedar"] || DUREES.cedar)[n] + 0.5);
    $("#an-st").textContent = l >= 0 ? LIGNES[l][1] : `${i + 1}. ${p.titre}`;

}
function arreterAnimatique() {

$("#an-fermer").addEventListener("click", arreterAnimatique);

})();
