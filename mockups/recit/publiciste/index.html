<title>Le Publiciste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;1,500&family=Playwrite+FR+Trad:wght@300;400&family=Gochi+Hand&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Mise en page : un fil de travail en une colonne (bulle du Publiciste, puis les pistes à choisir), sous une barre d'étapes collante.
   Jetons de l'interface : ceux de Getgents (styles/tokens.css : crème, corail, Sora). Chaque proposition porte sa propre direction.
   Univers clair assumé : toutes les couleurs sont posées ici, le fond du corps compris. */
:root {
  --ink: #2a1f19; --ink-2: #4d4139; --muted: #73665f; --faint: #a2958f;
  --bg: #fbf3ed; --bg-2: #f6ebe3; --card: #fffdf9; --line: #eadbd3; --line-soft: #f3e9e3;
  --corail: #e65d76; --corail-700: #c73758; --corail-tint: #ffdee2;
  --succes: #57a45b; --succes-tint: #d4f1d4;
  --scene: #fdfbf7; --nuit: #0f0c0a;
  --r: 18px; --r-s: 12px;
  --ombre: 0 1px 2px rgba(42,31,25,.05), 0 8px 24px -12px rgba(42,31,25,.14);
  --f-ui: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --largeur: 1180px;
  /* charte relevée sur le site de la marque, 27/11 */
  --marque-bleu: #29377d; --marque-bleu-nuit: #192563; --marque-rouge: #c54538; --marque-gris: #f6f6f6;
  color-scheme: light;
}
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--corail); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }
.lab { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: block; }

/* ── Barre d'étapes ── */
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.barre-in { max-width: var(--largeur); margin: 0 auto; padding-block: 12px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ident { display: flex; align-items: center; gap: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--card); font-weight: 700; font-size: 15px; letter-spacing: -.02em; box-shadow: inset 0 -3px 0 var(--corail); }
.ident b { display: block; font-size: 15px; line-height: 1.2; letter-spacing: -.01em; }
.ident small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.ident > span:nth-child(2) { min-width: 0; }
@media (max-width: 520px) { .ident small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
.ident .cout { margin-left: auto; flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.ident .cout b { display: inline; font-family: var(--f-mono); font-size: 12px; color: var(--ink); font-weight: 500; }
@media (max-width: 520px) { .cout-l { display: none; } }
.etapes { display: flex; gap: 2px; overflow-x: auto; padding-block: 10px 0; scrollbar-width: none; margin-inline: -6px; }
.etapes::-webkit-scrollbar { display: none; }
.etape-b { flex: none; position: relative; display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 10px 10px 0 0;
  padding: 8px 12px 12px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.etape-b::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: transparent; }
.etape-b:hover { color: var(--ink); }
.etape-b .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--line-soft); color: var(--muted); font-variant-numeric: tabular-nums; }
.etape-b[aria-current="step"] { color: var(--ink); font-weight: 600; }
.etape-b[aria-current="step"]::after { background: var(--corail); }
.etape-b[aria-current="step"] .n { background: var(--ink); color: var(--card); }
.etape-b.fait .n { background: var(--succes-tint); color: #2f6e33; }

/* ── Fil de l'étape ── */
main { max-width: var(--largeur); margin: 0 auto; padding-block: 36px 132px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vue { display: grid; gap: 28px; }
.intro { display: grid; gap: 6px; max-width: 760px; }
.intro .mono { letter-spacing: .04em; }
h2.titre { margin: 0; font-size: clamp(26px, 5.4vw, 38px); line-height: 1.08; letter-spacing: -.03em; font-weight: 700; text-wrap: balance; }
.sous { margin: 0; color: var(--muted); font-size: 16px; max-width: 62ch; }
.bulle { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start; max-width: 780px; }
.bulle .txt { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 16px 18px; box-shadow: var(--ombre); }
.bulle .txt p { margin: 0; }
.bulle .txt p + p { margin-top: 10px; }
.bulle .txt strong { font-weight: 600; }
.section-t { margin: 0; font-size: 17px; letter-spacing: -.01em; }

/* ── Cartes de choix ── */
.choix { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .choix.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.carte { position: relative; display: grid; gap: 12px; align-content: start; text-align: left; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--ombre); transition: border-color .15s, box-shadow .15s, transform .15s; }
.carte:hover { border-color: #d9c4b9; transform: translateY(-1px); }
.carte.choisie { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(42,31,25,.08), var(--ombre); }
.carte .badge-reco { position: absolute; top: 20px; left: 20px; z-index: 1; background: var(--corail); color: #fff; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.carte .badge-choisi { position: absolute; top: 20px; right: 20px; z-index: 1; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: none; }
.carte.choisie .badge-choisi { display: block; }
.carte img.planche { width: 100%; max-width: 100%; aspect-ratio: 928 / 1152; object-fit: cover; border-radius: 10px; display: block; background: var(--line-soft); }
.carte h3 { margin: 2px 6px 0; font-size: 18px; letter-spacing: -.015em; }
.carte .desc { margin: 0 6px; color: var(--ink-2); font-size: 14px; }
.pour-contre { margin: 0 6px 2px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line-soft); }
.pour-contre span { display: grid; grid-template-columns: 14px 1fr; gap: 4px; }
.pour-contre span::before { font-family: var(--f-mono); font-weight: 500; }
.pour-contre .p::before { content: "+"; color: var(--succes); }
.pour-contre .c::before { content: "−"; color: var(--corail-700); }
.carte .action { margin: 0 6px 6px; justify-self: start; border: 1px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 600; }
.carte.choisie .action { background: var(--ink); color: var(--card); }

.autre { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px dashed #d9c4b9; border-radius: var(--r); padding: 14px 16px; color: var(--muted); font-size: 14px; }
.autre textarea { flex: 1 1 260px; min-width: 0; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-s); padding: 10px 12px; resize: vertical; font-size: 15px; }
.bouton { border: 0; border-radius: 999px; background: var(--ink); color: var(--card); padding: 11px 20px; font-weight: 600; font-size: 14.5px; }
.bouton.corail { background: var(--corail); }
.bouton.corail:hover { background: var(--corail-700); }
.bouton.leger { background: var(--card); color: var(--ink); border: 1px solid var(--line); }

/* Typographie : spécimens */
.specimen { border-radius: 10px; padding: 20px 18px; display: grid; gap: 12px; min-height: 270px; align-content: start; }
.specimen .etq { justify-self: start; padding: 6px 12px; border-radius: 3px; transform: rotate(-2deg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.specimen .h { margin: 0; line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.specimen .b { margin: 0; font-size: 13.5px; line-height: 1.5; }
.specimen .dev { margin: 0; }
.specimen .btn { justify-self: start; padding: 9px 16px; border-radius: 999px; font-size: 13px; }
.spec-marque { background: var(--marque-gris); color: var(--marque-bleu); font-family: "Montserrat", sans-serif; }
.spec-marque .etq { background: #fff; font-family: "Gochi Hand", "Segoe Print", cursive; font-size: 21px; color: var(--marque-bleu); }
.spec-marque .h { font-weight: 800; font-size: 25px; color: #000; }
.spec-marque .dev { font-family: "Gochi Hand", cursive; font-size: 22px; color: var(--marque-rouge); }
.spec-marque .btn { background: var(--marque-bleu); color: #fff; font-weight: 700; }
.spec-cahier { color: var(--marque-bleu); font-family: "Montserrat", sans-serif; background-color: #fbfaf5;
  background-image: linear-gradient(90deg, transparent 0 30px, rgba(197,69,56,.55) 30px 31px, transparent 31px),
    linear-gradient(rgba(41,55,125,.32) 1px, transparent 1px), linear-gradient(rgba(120,150,210,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(120,150,210,.22) 1px, transparent 1px);
  background-size: 100% 100%, 100% 32px, 100% 8px, 32px 100%; padding-left: 44px; }
.spec-cahier .etq { background: #fff; font-family: "Playwrite FR Trad", "Segoe Script", cursive; font-size: 15px; line-height: 1.9; color: var(--marque-bleu); }
.spec-cahier .h { font-weight: 800; font-size: 24px; color: var(--marque-bleu-nuit); }
.spec-cahier .dev { font-family: "Playwrite FR Trad", cursive; font-size: 16px; line-height: 2; color: var(--marque-bleu); }
.spec-cahier .dev u { text-decoration-color: var(--marque-rouge); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.spec-cahier .btn { background: var(--marque-bleu); color: #fff; font-weight: 700; }
.spec-affiche { background: #efe6d6; color: #24201a; font-family: "Montserrat", sans-serif; }
.spec-affiche .etq { background: #24201a; color: #efe6d6; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; border-radius: 2px; }
.spec-affiche .h { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 29px; letter-spacing: -.03em; }
.spec-affiche .dev { font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 18px; color: var(--marque-rouge); }
.spec-affiche .btn { background: #24201a; color: #efe6d6; font-weight: 700; }

/* Couleurs */
.nuancier { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 10px; overflow: hidden; height: 64px; }
.nuancier span { display: block; }
.teintes { display: grid; gap: 4px; margin: 0 6px; }
.teintes div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.teintes code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.mini { border-radius: 10px; padding: 18px; display: grid; gap: 10px; justify-items: start; }
.mini .couv { width: 100%; height: 92px; border-radius: 6px; position: relative; overflow: hidden; }
.mini .couv i { position: absolute; left: 14px; top: 22px; padding: 6px 10px; font-style: normal; font-size: 13px; transform: rotate(-2deg); border-radius: 2px; }
.mini .filet { width: 100%; height: 4px; border-radius: 2px; }

/* Lecteur audio */
.lecteur { display: flex; align-items: center; gap: 12px; margin: 0 6px; min-width: 0; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: var(--card); display: grid; place-items: center; flex: none; }
.play:hover { background: var(--corail-700); }
.play svg { width: 17px; height: 17px; }
.piste { flex: 1; min-width: 40px; height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.piste i { display: block; height: 100%; width: 0; background: var(--corail); }
.duree { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.musique .ressenti, .ressenti { margin: 0 6px; font-size: 14px; color: var(--ink-2); }
.demande { margin: 0 6px 2px; padding: 9px 11px; background: var(--line-soft); border-radius: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); line-height: 1.55; }

/* Voix : un tableau */
.tableau-voix { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--ombre); overflow: hidden; }
.tableau-voix table { width: 100%; border-collapse: collapse; }
.tableau-voix th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 12px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
.tableau-voix td { padding: 12px 14px; border-top: 1px solid var(--line-soft); vertical-align: middle; }
.tableau-voix tbody tr:first-child td { border-top: 0; }
.tableau-voix tr.groupe-voix th { color: var(--ink-2); background: var(--line-soft); border-top: 1px solid var(--line); border-bottom: 0; padding: 8px 14px; }
.tableau-voix tbody tr.groupe-voix:first-child th { border-top: 0; }
.tableau-voix tr.choisie td { background: #fff6f3; }
.tableau-voix tr.choisie td:first-child { box-shadow: inset 3px 0 0 var(--corail); }
.tableau-voix tr.ecartee td { color: var(--faint); }
.tableau-voix tr.ecartee .lecteur, .tableau-voix tr.ecartee .v-nom b { opacity: .5; }
.v-nom b { display: block; font-size: 15.5px; letter-spacing: -.01em; }
.v-nom span { font-size: 12.5px; color: var(--muted); }
.v-genre { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line-soft); color: var(--ink-2); }
.v-timbre { font-size: 13.5px; color: var(--ink-2); }
.tableau-voix .lecteur { margin: 0; }
.tableau-voix .play { width: 36px; height: 36px; }
.tableau-voix .play svg { width: 14px; height: 14px; }
.v-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.mini-b { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; white-space: nowrap; }
.mini-b:hover { border-color: #d9c4b9; }
.mini-b[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.mini-b.non[aria-pressed="true"] { background: var(--corail-tint); color: var(--corail-700); border-color: var(--corail-tint); }
@media (max-width: 760px) {
  .tableau-voix thead { display: none; }
  .tableau-voix tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 14px; border-top: 1px solid var(--line-soft); }
  .tableau-voix tbody tr:first-child { border-top: 0; }
  .tableau-voix tr.groupe-voix { display: block; padding: 0; }
  .tableau-voix tr.groupe-voix th { display: block; }
  .tableau-voix td { padding: 0; border: 0; min-width: 0; }
  .tableau-voix td.c-timbre, .tableau-voix td.c-extrait, .tableau-voix td.c-actions { grid-column: 1 / -1; }
  .tableau-voix tr.choisie { background: #fff6f3; box-shadow: inset 3px 0 0 var(--corail); }
  .tableau-voix tr.choisie td, .tableau-voix tr.choisie td:first-child { background: none; box-shadow: none; }
  .v-actions { justify-content: flex-start; }
}
.jeux { display: flex; gap: 8px; flex-wrap: wrap; }
.jeux .mini-b { padding: 8px 14px; font-size: 13.5px; }

/* Ma voix */
.ma-voix { display: grid; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--ombre); padding: 20px; }
.ma-voix.choisie { border-color: var(--corail); box-shadow: 0 0 0 3px rgba(230,93,118,.12), var(--ombre); }
.mv-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mv-tete h3 { margin: 4px 0 0; font-size: 22px; letter-spacing: -.02em; }
.mv-statut { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
.mv-statut.ok { background: var(--succes-tint); color: #2f6e33; }
.mv-intro { margin: 0; max-width: 64ch; color: var(--ink-2); }
.mv-rappel { margin: 0; padding: 10px 12px; border-radius: var(--r-s); background: var(--bg); font-size: 13.5px; color: var(--ink-2); max-width: 72ch; }
.mv-etapes { margin: 0; padding-left: 22px; display: grid; gap: 18px; }
.mv-etapes li { display: grid; gap: 8px; padding-left: 4px; }
.mv-etapes li::marker { font-weight: 700; color: var(--corail-700); }
.mv-texte { margin: 0; padding: 14px 16px; border-left: 3px solid var(--corail); background: var(--bg); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 16px; line-height: 1.6; max-width: 70ch; }
.mv-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mv-actions label.bouton { cursor: pointer; display: inline-flex; align-items: center; }
.mv-ech { display: grid; gap: 4px; max-width: 420px; }
.mv-ech:empty { display: none; }
.mv-ech audio { width: 100%; }
.mv-nom { font-size: 12.5px; color: var(--muted); }
.mv-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; max-width: 64ch; cursor: pointer; }
.mv-consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--corail-700); flex: none; }
.mv-resultat { display: grid; gap: 8px; padding: 12px 14px; background: var(--succes-tint); border-radius: var(--r-s); max-width: 70ch; }

/* Storyboard : une scène par carte, le croquis en grand */
.sb-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--ombre); }
.sb-tete .note { max-width: 56ch; }
.sequences { display: grid; gap: 20px; }
.seq { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--r) + 4px); box-shadow: var(--ombre); overflow: hidden; }
@media (min-width: 820px) { .seq { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); } }
.seq.modifiee { border-color: #e9b9a9; }
.seq-image { position: relative; display: grid; place-items: center; padding: 18px; background: var(--scene); border-bottom: 1px solid var(--line-soft); }
@media (min-width: 820px) { .seq-image { border-bottom: 0; border-right: 1px solid var(--line-soft); padding: 22px; } }
.seq-image button { display: block; border: 0; padding: 0; background: none; cursor: zoom-in; width: 100%; max-width: 360px; border-radius: 10px; }
.seq-image img { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(42,31,25,.08), 0 12px 30px -16px rgba(42,31,25,.35); }
.seq-image .agrandir { position: absolute; right: 30px; bottom: 30px; padding: 5px 10px; border-radius: 999px; background: rgba(42,31,25,.72); color: #fff; font-size: 11.5px; pointer-events: none; }
.seq-corps { display: grid; gap: 18px; align-content: start; padding: 22px 22px 20px; min-width: 0; }
.seq-titre { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.seq-titre .num { font-size: 40px; line-height: .9; font-weight: 700; letter-spacing: -.04em; color: var(--corail); font-variant-numeric: tabular-nums; }
.seq-titre h3 { margin: 0; font-size: 21px; letter-spacing: -.02em; }

  bouton.textContent = "Arrêter";
}

/* ── Animatique : croquis + voix + musique ───────────────── */
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, anim = null;
const cacheBuf = {}, cacheImg = {};
async function tampon(url) {
  if (cacheBuf[url]) return cacheBuf[url];
  const ab = await fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  return cacheBuf[url] = await new Promise((ok, ko) => { const p = actx.decodeAudioData(ab, ok, ko); if (p && p.then) p.then(ok, ko); });
}
function image(src) { return cacheImg[src] || (cacheImg[src] = new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; })); }
async function lancerAnimatique() {
  audio.pause();
  const voix = voixJouable(S.voix), mus = S.musique || "souvenir";
  const ov = $("#animatique"); ov.hidden = false; $("#an-st").textContent = "Chargement…"; $("#an-info").textContent = `${nomVoix(voix)} · ${nomDe(MUSIQUES, mus)}`;
  const toile = $("#an-toile"), g = toile.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1); toile.width = toile.clientWidth * dpr; toile.height = toile.clientHeight * dpr;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  if (!actx && AC) actx = new AC();
  const imgs = await Promise.all(PLANS.map((_, i) => image(`medias/p${String(i + 1).padStart(2, "0")}.webp`)));
  let bv = null, bm = null;
  if (actx) { try { await actx.resume(); [bv, bm] = await Promise.all([tampon(`medias/voix-${voix}.mp3`), tampon(`medias/mus-${mus}.mp3`)]); } catch (e) { console.warn(e); } }
  if ($("#animatique").hidden) return;
  const T0 = actx && bv ? actx.currentTime + 0.1 : 0, debut = performance.now() + 100;
  const sources = [];
  if (actx && bv) {
    const sortie = actx.createGain(); sortie.connect(actx.destination);
    const v = actx.createBufferSource(); v.buffer = bv; v.connect(sortie); v.start(T0); sources.push(v);
    if (bm) { // la musique boucle sous la voix et s'efface quand elle parle
      const gm = actx.createGain(); gm.connect(sortie); gm.gain.setValueAtTime(0, T0); gm.gain.linearRampToValueAtTime(0.5, T0 + 1);
      const d = DUREES[voix] || DUREES[VOIX_DEFAUT];
      LIGNES.forEach(([t], k) => { gm.gain.setTargetAtTime(0.28, T0 + t - 0.2, 0.12); gm.gain.setTargetAtTime(0.5, T0 + t + d[k] + 0.2, 0.3); });
      gm.gain.setTargetAtTime(0.0001, T0 + 70, 0.6);
      const m = actx.createBufferSource(); m.buffer = bm; m.loop = true; m.connect(gm); m.start(T0); m.stop(T0 + 73); sources.push(m);
    }
    anim = { sources, sortie, T0, pause: false };
  } else anim = { sources, T0: 0, pause: false };
  anim.debut = debut;
  const temps = () => anim.sortie ? actx.currentTime - anim.T0 : (performance.now() - anim.debut) / 1000;
  const dessiner = (src, alpha, zoom) => {
    if (!src) return; const W = toile.width, H = toile.height, s = Math.min(W / src.width, H / src.height) * 0.94 * zoom;
    g.globalAlpha = alpha; g.drawImage(src, (W - src.width * s) / 2, (H - src.height * s) / 2, src.width * s, src.height * s); g.globalAlpha = 1;
  };
  const boucle = () => {
    if (!anim) return;
    const t = temps();
    g.fillStyle = "#0f0c0a"; g.fillRect(0, 0, toile.width, toile.height);
    const i = Math.max(0, PLANS.findIndex((p) => t >= p.t[0] && t < p.t[1]));
    const p = PLANS[i], k = (t - p.t[0]) / (p.t[1] - p.t[0]);
    if (i > 0 && t - p.t[0] < 0.5) dessiner(imgs[i - 1], 1, 1.04);
    dessiner(imgs[i], i === 0 ? 1 : Math.min(1, (t - p.t[0]) / 0.5), 1 + 0.04 * k);
    const l = LIGNES.findIndex(([d], n) => t >= d && t < d + (DUREES[voixJouable(S.voix)])[n] + 0.5);
    $("#an-st").textContent = l >= 0 ? LIGNES[l][1] : `${i + 1}. ${p.titre}`;
    $("#an-fil").style.width = Math.min(100, t / 72 * 100) + "%";
    if (t >= 72.5) return arreterAnimatique();
    anim.raf = requestAnimationFrame(boucle);
  };
  boucle();
}
function arreterAnimatique() {
  if (!anim) return; cancelAnimationFrame(anim.raf);
  for (const s of anim.sources) { try { s.stop(); } catch (e) {} }
  if (anim.sortie) try { anim.sortie.disconnect(); } catch (e) {}
  anim = null; $("#animatique").hidden = true; $("#an-pause").textContent = "Pause";
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
$("#an-fermer").addEventListener("click", arreterAnimatique);
$("#an-pause").addEventListener("click", () => {
  if (!anim || !actx) return;
  if (actx.state === "running") { actx.suspend(); $("#an-pause").textContent = "Reprendre"; } else { actx.resume(); $("#an-pause").textContent = "Pause"; }
});
/* ── Entretien : écouter une réplique, rejouer en mode voix ─ */
let repliqueActive = null;
function ecouterReplique(n, bouton) {
  arreterAnimatique(); arreterVocal();
  document.querySelectorAll(".ecouter").forEach((b) => b.setAttribute("aria-pressed", "false"));
  if (boutonActif) { boutonActif.innerHTML = ICONE.play; barreActive.style.width = "0"; boutonActif = null; }
  if (repliqueActive === n && !audio.paused) { audio.pause(); repliqueActive = null; return; }
  repliqueActive = n; audio.src = `medias/pub-${String(n).padStart(2, "0")}.mp3`; audio.dataset.entier = "";
  bouton.setAttribute("aria-pressed", "true");
  audio.onended = () => { bouton.setAttribute("aria-pressed", "false"); repliqueActive = null; audio.onended = null; };
  audio.play().catch(() => {});
}
const voixPub = new Audio(); voixPub.preload = "auto";
let vocal = null;
function lancerVocal() {
  audio.pause(); arreterAnimatique();
  document.querySelectorAll(".ecouter").forEach((b) => b.setAttribute("aria-pressed", "false"));
  vocal = { i: 0, pause: false, minuteur: null };
  $("#vocal").hidden = false; $("#vo-pause").textContent = "Pause"; $("#vo-fermer").focus();
  jouerVocal();
}
function jouerVocal() {
  if (!vocal) return;
  clearTimeout(vocal.minuteur); voixPub.onended = null;
  if (vocal.i >= ENTRETIEN.length) { $("#vo-etat").textContent = "Fin de l'entretien"; $("#vo-orbe").className = "orbe"; $("#vo-phrase").textContent = "La direction artistique commence à l'étape 1."; $("#vo-phrase").className = "phrase"; return; }
  const [qui, t] = ENTRETIEN[vocal.i];
  const orbe = $("#vo-orbe"), phrase = $("#vo-phrase");
  if (qui === "p") {
    const n = ENTRETIEN.slice(0, vocal.i + 1).filter((m) => m[0] === "p").length;
    orbe.className = "orbe parle"; $("#vo-etat").textContent = "Le Publiciste parle"; phrase.className = "phrase"; phrase.textContent = t;
    voixPub.src = `medias/pub-${String(n).padStart(2, "0")}.mp3`;
    voixPub.onended = () => { if (vocal && !vocal.pause) { vocal.i++; vocal.minuteur = setTimeout(jouerVocal, 500); } };
    voixPub.play().catch(() => { vocal.minuteur = setTimeout(() => { vocal.i++; jouerVocal(); }, 3000); });
  } else {
    orbe.className = "orbe ecoute"; $("#vo-etat").textContent = "Alfred répond"; phrase.className = "phrase alfred"; phrase.textContent = "";
    let k = 0; const mots = t.split(" ");
    const taper = () => {
      if (!vocal || vocal.pause) return;
      phrase.textContent = mots.slice(0, ++k).join(" ");
      vocal.minuteur = setTimeout(k < mots.length ? taper : () => { vocal.i++; jouerVocal(); }, k < mots.length ? 230 : 900);
    };
    vocal.reprendre = taper; vocal.minuteur = setTimeout(taper, 400);
  }
}
function arreterVocal() { if (!vocal) return; clearTimeout(vocal.minuteur); voixPub.pause(); voixPub.onended = null; vocal = null; $("#vocal").hidden = true; }
$("#vo-fermer").addEventListener("click", arreterVocal);
$("#vo-suiv").addEventListener("click", () => { if (!vocal) return; voixPub.pause(); vocal.pause = false; $("#vo-pause").textContent = "Pause"; vocal.i++; jouerVocal(); });
$("#vo-pause").addEventListener("click", () => {
  if (!vocal) return; vocal.pause = !vocal.pause; $("#vo-pause").textContent = vocal.pause ? "Reprendre" : "Pause";
  if (vocal.pause) { clearTimeout(vocal.minuteur); voixPub.pause(); }
  else if (ENTRETIEN[vocal.i] && ENTRETIEN[vocal.i][0] === "p" && voixPub.currentTime > 0 && !voixPub.ended) voixPub.play().catch(() => {});
  else jouerVocal();
});

/* ── Visionneuse : un croquis en grand ───────────────────── */
let croquis = -1, retourFocus = null;
function ouvrirCroquis(i) {
  if (croquis < 0) retourFocus = document.activeElement;
  croquis = (i + PLANS.length) % PLANS.length; const p = PLANS[croquis];
  $("#vi-img").src = `medias/p${String(croquis + 1).padStart(2, "0")}.webp`; $("#vi-img").alt = `Croquis de la scène ${croquis + 1} : ${p.titre}`;
  $("#vi-num").textContent = `Scène ${croquis + 1} sur ${PLANS.length} · ${fmt(p.t[0])}–${fmt(p.t[1])}`;
  $("#vi-leg").textContent = p.titre;
  $("#visionneuse").hidden = false; $("#vi-fermer").focus();
}
function fermerCroquis() { croquis = -1; $("#visionneuse").hidden = true; if (retourFocus) retourFocus.focus(); }
$("#vi-fermer").addEventListener("click", fermerCroquis);
$("#vi-prec").addEventListener("click", () => ouvrirCroquis(croquis - 1));
$("#vi-suiv").addEventListener("click", () => ouvrirCroquis(croquis + 1));
$("#visionneuse").addEventListener("click", (e) => { if (e.target.id === "visionneuse") fermerCroquis(); });
addEventListener("keydown", (e) => {
  if (vocal && e.key === "Escape") { arreterVocal(); return; }
  if (croquis >= 0) { if (e.key === "Escape") fermerCroquis(); else if (e.key === "ArrowLeft") ouvrirCroquis(croquis - 1); else if (e.key === "ArrowRight") ouvrirCroquis(croquis + 1); return; }
  if (e.key === "Escape" && anim) arreterAnimatique();
});

rendre();
})();
</script>
